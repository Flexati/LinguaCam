name: LinguaCam Release Bundle

on:
  workflow_dispatch:
  push:
    tags: [ 'v*.*' ]
  # GIR7: build di verifica su PR (senza firmare il release AAB).
  # La verifica usa il debug keystore interno di CI (NON servono i 4 secrets release).
  pull_request:
    branches: [ main ]

jobs:
  release-build:
    name: Bundle Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # GIR7: skip della job release-build per PR (mantieni solo il verify-build).
    # Su PR viene eseguito solo verify-build sotto.
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cache: true
          cache-key: ${{ runner.os }}-android-sdk-34

      - name: Install Android SDK packages
        run: |
          set +o pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
        shell: bash

      - name: Decode keystore from base64 secret
        run: |
          mkdir -p app/keystores
          echo "$KEY_JKS_BASE64" | base64 --decode > app/keystores/release.jks
          chmod 600 app/keystores/release.jks
          ls -la app/keystores/release.jks
        env:
          KEY_JKS_BASE64: ${{ secrets.KEY_JKS_BASE64 }}

      - name: Build release AAB
        run: ./gradlew bundleRelease --stacktrace
        env:
          LINGUACAM_KEYSTORE_FILE: app/keystores/release.jks
          LINGUACAM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LINGUACAM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LINGUACAM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Cleanup keystore (security rimuove dal workspace post-build)
        if: always()
        run: |
          rm -f app/keystores/release.jks
          rm -rf app/keystores/
          echo "Keystore rimosso dal workspace."

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 365

  # GIR7: job di verifica su PR — compila debug APK + run test JVM.
  # Non firma release AAB (non servono secrets release). Usa il debug keystore interno di CI.
  verify-build:
    name: Verify Build (debug + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cache: true
          cache-key: ${{ runner.os }}-android-sdk-34

      - name: Install Android SDK packages
        run: |
          set +o pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
        shell: bash

      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk-verify
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
