name: LinguaCam Release Bundle

on:
  workflow_dispatch:
  push:
    tags: [ 'v*.*' ]

jobs:
  release-build:
    name: Bundle Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
        shell: bash

      - name: Decode keystore from base64 secret
        run: |
          mkdir -p app/keystores
          echo "$KEY_JKS_BASE64" | base64 --decode > app/keystores/release.jks
          ls -la app/keystores/release.jks
        env:
          KEY_JKS_BASE64: ${{ secrets.KEY_JKS_BASE64 }}

      - name: Build release AAB
        run: ./gradlew bundleRelease --stacktrace
        env:
          LINGUACAM_KEYSTORE_FILE: app/keystores/release.jks
          LINGUACAM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LINGUACAM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LINGUACAM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 365
